<html lang="en">

<style>

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;background:#f2f5f9;color:#17202e}
main{max-width:980px;margin:0 auto;padding:0 14px 40px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}

input,select,textarea,button{font:inherit;padding:11px 12px;border:1px solid #c3ccd8;border-radius:10px;min-height:46px;background:#fff;color:inherit}
input,select,textarea{width:100%}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;border:0;font-weight:600;cursor:pointer;padding:10px 16px;text-decoration:none;border-radius:10px;min-height:44px}
button.sec,.btn.sec{background:#e4eaf2;color:#17202e}.btn.wa{background:var(--g)}button.bad{background:#fff;color:var(--r);border:1px solid #e7b4af}
.gh{background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.3)!important}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cmyk{display:flex;height:6px}.cmyk i{flex:1}.cmyk i:nth-child(1){background:#00aeef}.cmyk i:nth-child(2){background:#ec008c}.cmyk i:nth-child(3){background:#fff200}.cmyk i:nth-child(4){background:#000}

.intro{font-size:17px;margin:18px 0 4px}.muted{color:var(--mu);font-size:14px}.err{color:var(--r);font-size:14px;min-height:20px;font-weight:600}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.bar>*{flex:1;min-width:160px}

.orow.new{border-left:4px solid var(--m)}.orow:hover{border-color:var(--c)}.orow b,.orow .muted{display:block}
.tag{display:inline-block;background:#eef2f7;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600;margin:0 6px 4px 0}

.st-new{background:#fde7ef;color:#9d1c4a}.st-review,.st-hold{background:#fff3cd;color:#7a5600}.st-accepted,.st-payment{background:#dff1fa;color:#065f8d}
.st-production{background:var(--ink);color:#fff}.st-ready{background:#dcf3e5;color:#0f6b36}.st-rejected,.st-cancelled{background:#fbe4e1;color:#912018}

.mbox{background:#fff;border-radius:14px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}

.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.mix{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.mix i{font-style:normal;background:#eef2f7;border-radius:99px;padding:4px 12px;font-size:14px}.mix b{display:inline;font:700 14px var(--d)}
.orow{border:0;border-radius:16px;box-shadow:var(--sh);transition:transform .12s}.orow:hover{transform:translateY(-2px)}
.pay-ok{background:#dcf3e5;color:#0f6b36}.pay-no{background:#fff3cd;color:#7a5600}
.steps{display:flex;gap:10px;margin:16px 0 0}.steps span{flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:#e8eef6;color:var(--mu);font-weight:600;font-size:14px}

.steps span.on{background:var(--ink);color:#fff}.steps span.on i{background:var(--c);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.opts.m{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opt{flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#f4f7fb;color:var(--ink);box-shadow:none;border:2px solid transparent;padding:14px;min-height:64px;font-weight:500}
.opt span{font-size:13px;color:var(--mu);font-weight:400}.opt.on{border-color:var(--c);background:#eaf5fb}.opt:disabled{opacity:.45}
.acct{background:#f4f7fb;border-radius:14px;padding:14px;margin-top:10px}
.est{margin-top:14px;padding:12px 16px;border-radius:14px;background:#eaf5fb;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between}.est:empty{display:none}
.tot b{font:700 20px var(--d);color:var(--ink)}.tot.big b{font-size:30px}
.act{position:sticky;bottom:0;padding:14px 0;background:linear-gradient(transparent,#f3f6fb 35%);z-index:5}.act button{flex:1;min-height:52px;font-size:17px}
.ok .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#dcf3e5;color:var(--g);font-size:34px}
progress{height:10px;border-radius:8px;accent-color:var(--c)}
.ed .edbox{height:min(100%,900px)}.edtabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.edv{background:#e4eaf3;border-radius:14px;padding:10px;display:grid;place-items:center;min-height:240px}
.edv canvas{max-width:100%;max-height:50vh;background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.18);touch-action:none}
.edc{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:12px}.edc input[type=range]{padding:0;min-height:32px;border:0;box-shadow:none;accent-color:var(--c)}.edc output{font-weight:700;color:var(--c)}
@media(max-width:700px){.edc,.opts{grid-template-columns:1fr}}
.fi .big{flex:1 1 100%;min-height:52px;font-size:17px;box-shadow:0 4px 12px rgba(8,119,176,.28)}
.steps span{font-size:13px;padding:10px 8px;justify-content:center}
</style>

const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const SHOP_ID=new URLSearchParams(location.search).get('shop');
const BASE=location.origin+location.pathname;
const pubBase=()=>{const s=String((CURRENT_CFG||{}).site_url||'').trim().split('?')[0].split('#')[0];return/^https?:\/\//.test(s)?s:BASE};
/* Cloud connection: paste your Supabase Project URL and publishable key here. */
const SBC={url:'https://einznfibylssyjzyazok.supabase.co',key:'sb_publishable_2yIRQGN2DdHx_IEocU9btg_Dz9E8iSm'};
const SB_URL=SBC.url||'',SB_KEY=SBC.key||'';
const REC=/type=recovery/.test(location.hash);
const sb=SB_URL&&window.supabase?supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}}):null;

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function pdfPages(blob,max,scale,cb){const d=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise,n=Math.min(d.numPages,max);for(let i=1;i<=n;i++){const pg=await d.getPage(i),v=pg.getViewport({scale:scale(pg.getViewport({scale:1}))}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;await cb(cv,i)}return d.numPages}
async function printFiles(o,idx){const p=o.opts,imgs=[],skip=[];
  for(const i of idx){const f=o.files[i],x=ext(f.name);
    if(/^(jpg|jpeg|png)$/.test(x))imgs.push(URL.createObjectURL((await blobOf(f))));
    else if(x==='pdf'){if(!window.pdfjsLib){open(URL.createObjectURL((await blobOf(f))));continue}await pdfPages((await blobOf(f)),500,()=>2,cv=>new Promise(r=>cv.toBlob(b=>{imgs.push(URL.createObjectURL(b));cv.width=cv.height=0;r()},'image/jpeg',.9)))}

  const pg=/^(A3|A4|A5|Letter|Legal)$/i.test(p.size)?'size:'+p.size+' '+(p.orient==='landscape'?'landscape':'portrait')+';':'';
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;left:-10000px;top:0;width:800px;height:1100px;border:0';
  fr.srcdoc='<!doctype html><style>@page{'+pg+'margin:0}html,body{margin:0}img{display:block;max-width:100%;max-height:100vh;margin:0 auto;page-break-after:always}</style>'+all.map(u=>'<img src="'+u+'">').join('');
  fr.onload=async()=>{try{await Promise.all([...fr.contentDocument.images].map(i=>i.decode().catch(()=>{})))}catch{}fr.contentWindow.focus();fr.contentWindow.print();setTimeout(()=>{fr.remove();imgs.forEach(u=>URL.revokeObjectURL(u))},120000)};
  document.body.appendChild(fr)}
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const ST={new:'New',review:'Under Review',accepted:'Accepted',payment:'Payment Pending',production:'In Production',ready:'Ready',completed:'Completed',rejected:'Rejected',cancelled:'Cancelled',hold:'On Hold'};
const FLOW={new:['review','rejected','cancelled'],review:['accepted','rejected','cancelled','hold'],accepted:['payment','production','cancelled','hold'],payment:['production','cancelled'],production:['ready','hold'],ready:['completed'],hold:['review','accepted','production','cancelled'],completed:[],rejected:[],cancelled:[]};
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');

const norm=o=>{const c=o.customer&&typeof o.customer==='object'?o.customer:{},p=o.opts&&typeof o.opts==='object'?o.opts:{};
  return{...o,number:String(o.number||''),status:ST[o.status]?o.status:'new',customer:{name:String(c.name||'Unknown'),phone:/^0+$/.test(String(c.phone||''))?'':String(c.phone||''),email:String(c.email||'')},
  opts:{type:p.type||'bw',size:p.size||'A4',sides:p.sides||'single',orient:p.orient||'portrait',copies:+p.copies||1,extras:Array.isArray(p.extras)?p.extras.map(String):[]},
  instructions:String(o.instructions||''),pages:+o.pages||0,amount:+o.amount||0,paid:+o.paid||0,paid_at:o.paid_at?+new Date(o.paid_at):0,pay_method:String(o.pay_method||'counter'),pay_ref:String(o.pay_ref||''),expected:+o.expected||0,created:+new Date(o.created),updated:+new Date(o.updated),files:Array.isArray(o.files)?o.files:[],log:Array.isArray(o.log)?o.log:[]}};
const allO=async()=>CACHE,getO=async id=>CACHE.find(o=>o.id===id);
function keepBlobs(n,p){if(p)n.files.forEach((f,k)=>{if(p.files[k]&&p.files[k].path===f.path)f.blob=p.files[k].blob});return n}
function merge(n){const i=CACHE.findIndex(x=>x.id===n.id);keepBlobs(n,CACHE[i]);if(i>=0)CACHE[i]=n;else CACHE.unshift(n)}
const applyRow=r=>{const row=Array.isArray(r)?r[0]:r;if(row)merge(norm(row))};
async function setStatus(o,s){const {data,error}=await sb.rpc('set_order_status',{p_order:o.id,p_status:s,p_msg:'Status '+ST[o.status]+' → '+ST[s]});if(error)throw error;applyRow(data)}
async function sync(full){
  const inc=!full&&primed&&lastSeen;let q=sb.from('orders').select('*').eq('shop_id',CURRENT_SHOP_ID);
  q=inc?q.gt('updated',lastSeen).order('updated',{ascending:true}):q.order('created',{ascending:false}).limit(1000);
  const {data,error}=await q;
  if(error){console.error(error);online=false;onlineMsg='Offline - retrying';live();return null}
  const rows=data.map(norm),old=new Set(CACHE.map(o=>o.id));let added;
  if(inc){added=rows.filter(o=>!old.has(o.id));rows.forEach(merge);if(data.length)lastSeen=data[data.length-1].updated}
  else{added=primed?rows.filter(o=>!old.has(o.id)):[];const prev=new Map(CACHE.map(o=>[o.id,o]));CACHE=rows.map(n=>keepBlobs(n,prev.get(n.id)));lastSeen=data.reduce((m,r)=>r.updated>m?r.updated:m,'')}
  primed=true;online=true;live();return added}
async function poll(full){if(polling)return;polling=true;try{const a=await sync(full);if(!a)return;
  if(a.length){unread+=a.length;beep();if(document.hidden||!document.hasFocus())notify('New printing request'+(a.length>1?'s':''),a.length>1?a.length+' new requests':a[0].number+(a[0].customer.name!=='Unknown'?' - '+a[0].customer.name:''))}
  const g=JSON.stringify(CACHE.map(o=>[o.id,o.status,o.files.length,o.updated]));if(g!==sig){sig=g;refresh()}}finally{polling=false}}
/* Privacy + tidy-up: delete files of finished orders after RETAIN_DAYS, and remove uploads that never became an order */
async function housekeeping(){try{const st=sb.storage.from('uploads');
  const rd=Math.max(+CFG().retention_days||RETAIN_DAYS,1);for(const o of CACHE.filter(o=>o.files.length&&Date.now()-o.created>rd*DAY)){
    const {error}=await st.remove(o.files.map(f=>f.path));if(error)continue;
    const {data}=await sb.rpc('clear_order_files',{p_order:o.id,p_msg:'Files auto-deleted after '+rd+' day(s)'});applyRow(data)}
  const {data:dirs}=await st.list(CURRENT_SHOP_ID,{limit:1000});
  for(const d of dirs||[]){const {data:ex,error:ee}=await sb.from('orders').select('id').eq('shop_id',CURRENT_SHOP_ID).eq('id',d.name).maybeSingle();if(ee||ex)continue;
    const {data:fs}=await st.list(CURRENT_SHOP_ID+'/'+d.name,{limit:100});
    if(fs&&fs.length&&fs.every(f=>Date.now()-new Date(f.created_at||0)>2*36e5))await st.remove(fs.map(f=>CURRENT_SHOP_ID+'/'+d.name+'/'+f.name))}
  refresh()}catch(e){console.error(e)}}

async function registerShop(){
  const er=$('#er'),shopName=$('#sn').value.trim(),email=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,pw2=$('#pw2').value;
  if(shopName.length<2)return er.textContent='Enter a valid shop name.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return er.textContent='Enter a valid email address.';
  if(pw.length<8)return er.textContent='Password must be at least 8 characters.';
  if(pw!==pw2)return er.textContent='Passwords do not match.';
  $('#ok').disabled=true;$('#ok').textContent='Creating shop...';
  const shopId=makeShopId(shopName);
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{shop_name:shopName,shop_id:shopId}}});
  if(error){$('#ok').disabled=false;$('#ok').textContent='Create Shop';return er.textContent=error.message}
  if(!data.user){$('#ok').disabled=false;return er.textContent='Supabase did not return a user. Please try again.'}
  if(data.session){
    const r=await ensureShop(data.user,shopName,shopId);
    if(r.error){$('#ok').disabled=false;$('#ok').textContent='Create Shop';return er.textContent=r.error.message}
    await bootAdmin();return;
  }
  er.style.color='var(--g)';
  er.textContent='Account created. Check your email if confirmation is enabled, then return here and sign in. Your shop identity is saved with your account.';
  $('#ok').disabled=false;$('#ok').textContent='Create Shop';
}
async function ensureShop(user,requestedName='',requestedId=''){
  const {data:existing,error:fe}=await sb.from('shops').select('id,shop_name,auth_user_id,created_at').eq('auth_user_id',user.id).maybeSingle();
  if(fe)return {error:fe};
  if(existing){CURRENT_SHOP=existing;CURRENT_SHOP_ID=existing.id;return {shop:existing}};
  const name=(requestedName||user.user_metadata?.shop_name||'My Print Shop').trim();
  let id=requestedId||user.user_metadata?.shop_id||makeShopId(name);
  const {data:created,error}=await sb.from('shops').insert({id,shop_name:name,auth_user_id:user.id}).select('id,shop_name,auth_user_id,created_at').single();
  if(error)return {error};
  CURRENT_SHOP=created;CURRENT_SHOP_ID=created.id;return {shop:created};
}
async function loginShop(){
  const er=$('#er'),email=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;
  if(!email||!pw)return er.textContent='Enter your email and password.';
  $('#ok').disabled=true;$('#ok').textContent='Signing in...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){$('#ok').disabled=false;$('#ok').textContent='Sign in';return er.textContent=error.message}
  const r=await ensureShop(data.user);
  if(r.error){await sb.auth.signOut();$('#ok').disabled=false;$('#ok').textContent='Sign in';return er.textContent='Signed in, but this account is not authorized for a shop: '+r.error.message}
  await bootAdmin();
}
